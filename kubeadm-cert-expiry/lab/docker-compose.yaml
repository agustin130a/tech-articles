# Laboratorio local: textfile -> node_exporter -> Prometheus -> Grafana (alerta).
# Ver ../README.md, sección "Laboratorio".
services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --collector.disable-defaults
      - --collector.textfile
      # Misma ruta que usarías en el DaemonSet de kube-prometheus-stack, que ya monta
      # la raíz del host en /host/root (hostRootFsMount).
      - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
    volumes:
      - ./textfile:/host/root/var/lib/node_exporter/textfile_collector:ro

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../alerts/prometheus-kubeadm-certs.rules.yaml:/etc/prometheus/rules/kubeadm-certs.yaml:ro
    ports:
      - "19091:9090"

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "13000:3000"
